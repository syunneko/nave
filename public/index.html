<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Transit AI - 音声対応スマート経路案内</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="text-slate-800 min-h-screen font-sans antialiased">

  <header class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="./DEMO.jpg" alt="ナビロボット" class="w-9 h-9 rounded-xl object-cover border border-sky-200 bg-white shadow-sm shrink-0" />
        <div class="truncate">
          <div class="flex items-center gap-1.5">
            <h1 class="text-base sm:text-lg font-extrabold text-slate-900">Transit AI</h1>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200">音声対話AI</span>
          </div>
          <p class="text-[11px] text-slate-500 truncate">話しかけて検索＆ナビロボ案内</p>
        </div>
      </div>

      <button type="button" id="openSettingsBtn" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 transition">
        ⚙️ 設定
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 sm:px-5 py-4 sm:py-8 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-7 items-start">
    <!-- 左カラム：キャラクター＋検索フォーム -->
    <section class="lg:col-span-4 lg:sticky lg:top-24 space-y-4">
      <!-- キャラクター対話カード -->
      <div class="bg-gradient-to-b from-sky-50 via-white to-indigo-50/60 border border-sky-200 rounded-2xl sm:rounded-3xl p-4 shadow-sm">
        <div class="flex items-center gap-3.5">
          <div id="avatarWrap" class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-white border-2 border-sky-200 shadow-sm flex items-center justify-center shrink-0 overflow-hidden char-idle">
            <img src="./DEMO.jpg" alt="案内ロボット" class="w-full h-full object-contain p-1" />
          </div>
          <div class="min-w-0 flex-1 space-y-1.5">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-extrabold text-slate-900">ナビロボ</span>
              <span id="charStateBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">待機中</span>
            </div>
            <p id="charBubble" class="text-xs sm:text-sm font-bold text-slate-800 bg-white border border-sky-100 rounded-2xl rounded-tl-sm px-3 py-2 leading-snug shadow-2xs">
              こんにちは！行きたい場所を話しかけてね！
            </p>
          </div>
        </div>

        <div class="mt-3 pt-3 border-t border-sky-200/70 flex items-center justify-between gap-2">
          <label class="inline-flex items-center gap-1.5 text-[11px] font-bold text-slate-700 cursor-pointer">
            <input type="checkbox" id="handsFreeToggle" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
            <span>🔁 連続会話モード</span>
          </label>
          <button type="button" id="voiceSearchBtn" class="shrink-0 px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-700 hover:to-sky-700 text-white text-xs font-bold shadow-sm transition">
            🎙️ 話しかける
          </button>
        </div>

        <div id="voiceBox" class="hidden mt-2.5 bg-white border border-sky-200 rounded-xl px-3 py-2 text-xs">
          <span id="voiceStatus" class="font-bold text-sky-700 block"></span>
          <p id="voiceText" class="font-medium text-slate-900"></p>
        </div>
      </div>

      <!-- 検索フォーム -->
      <div class="bg-white border border-slate-200 rounded-2xl sm:rounded-3xl p-4 sm:p-5 shadow-sm">
        <form id="searchForm" class="space-y-3.5">
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5">
            <div>
              <div class="flex items-center justify-between mb-1">
                <label for="origin" class="text-xs font-bold text-emerald-700">🟢 出発地</label>
                <button type="button" id="gpsBtn" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 transition">📍 現在地を使う</button>
              </div>
              <input type="text" id="origin" value="博多駅" required class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-medium focus:outline-none focus:border-sky-500" />
              <p id="gpsStatus" class="text-xs mt-1 hidden"></p>
            </div>

            <div class="flex items-center justify-between">
              <span class="text-[11px] text-slate-400">出発と到着を入替</span>
              <button type="button" id="swapBtn" class="px-3 py-1 rounded-full bg-white hover:bg-sky-50 text-slate-600 border border-slate-300 text-xs font-bold transition">⇅ 入替</button>
            </div>

            <div>
              <label for="destination" class="block text-xs font-bold text-rose-700 mb-1">🔴 目的地</label>
              <input type="text" id="destination" value="天神駅" required class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-medium focus:outline-none focus:border-sky-500" />
            </div>
          </div>

          <div>
            <label for="userNote" class="block text-xs font-bold text-slate-700 mb-1">追加の要望・話した内容</label>
            <input type="text" id="userNote" placeholder="例：荷物が多い、飛行機なしで安く" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base focus:outline-none focus:bg-white focus:border-sky-500" />
          </div>

          <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
            <span id="settingsSummary" class="font-bold text-slate-700">✈️ 使う ／ ⚡ 一番早い</span>
            <button type="button" id="openSettingsInlineBtn" class="font-bold text-sky-700 hover:underline">設定を変更</button>
          </div>

          <button type="submit" id="submitBtn" class="hidden lg:flex w-full py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold text-sm shadow-md justify-center">ルートを検索</button>
        </form>
      </div>
    </section>

    <!-- 右カラム：AIエージェント案内＆候補 -->
    <section id="resultsSection" class="lg:col-span-8 space-y-4 sm:space-y-6">
      <div id="emptyState" class="bg-white border border-dashed border-slate-300 rounded-2xl sm:rounded-3xl p-8 text-center space-y-2">
        <img src="./DEMO.jpg" alt="ナビロボ" class="w-16 h-16 mx-auto rounded-2xl object-contain border border-sky-100 p-1 char-idle" />
        <p class="text-slate-700 font-bold text-sm">「🎙️ 話しかける」を押して、ナビロボに行き先を伝えてね！</p>
        <p class="text-slate-500 text-xs">例：「今いるところから福岡空港まで一番早いルートは？」「天神まで安く行きたい」</p>
      </div>

      <div id="loadingState" class="hidden bg-white border border-slate-200 rounded-2xl sm:rounded-3xl p-8 text-center space-y-3">
        <img src="./DEMO.jpg" alt="検索中" class="w-16 h-16 mx-auto rounded-2xl object-contain p-1 animate-bounce" />
        <p class="text-sm font-bold text-slate-700">ナビロボがぴったりなルートを探しているよ...</p>
      </div>

      <div id="errorState" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 text-rose-700 text-sm font-bold"></div>

      <div id="resultContainer" class="hidden space-y-4 sm:space-y-6">
        <div class="bg-white border border-sky-200 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-sm space-y-4">
          <div class="flex items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2.5 min-w-0">
              <div id="replyAvatarWrap" class="w-11 h-11 rounded-2xl bg-sky-50 border border-sky-200 flex items-center justify-center shrink-0 overflow-hidden char-idle">
                <img src="./DEMO.jpg" alt="ナビロボ" class="w-full h-full object-contain p-0.5" />
              </div>
              <div class="truncate">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-extrabold text-slate-900">ナビロボ 乗降ガイド</span>
                  <span id="speakingIndicator" class="hidden items-center gap-1 text-[11px] font-bold text-sky-700 bg-sky-100 px-2 py-0.5 rounded-full">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-600 speaking-dot"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-600 speaking-dot"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-600 speaking-dot"></span>
                    <span>お話し中</span>
                  </span>
                </div>
                <p class="text-xs text-slate-500 truncate">乗り降りする駅やバス停を分かりやすく案内するよ</p>
              </div>
            </div>
            <button type="button" id="speakBtn" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-50 hover:bg-sky-100 text-sky-800 border border-sky-200">🔊 音声で聞く</button>
          </div>

          <div class="flex justify-end">
            <div id="userQueryBubble" class="max-w-[88%] bg-slate-100 text-slate-800 text-xs sm:text-sm font-medium px-3.5 py-2.5 rounded-2xl rounded-tr-sm"></div>
          </div>

          <div class="flex items-start gap-2.5">
            <img src="./DEMO.jpg" alt="ナビロボ" class="w-9 h-9 rounded-full bg-sky-50 border border-sky-200 object-contain p-0.5 shrink-0 mt-0.5" />
            <div class="flex-1 bg-sky-50/70 border border-sky-100 rounded-2xl rounded-tl-sm p-3.5 sm:p-4 space-y-2.5">
              <p id="aiReplyLead" class="text-sm sm:text-base font-bold text-slate-900 leading-relaxed"></p>
              <div id="aiReplyHighlights" class="space-y-2"></div>
            </div>
          </div>
        </div>

        <div>
          <h3 class="text-xs sm:text-sm font-bold text-slate-600 mb-2.5 px-1">候補ルート一覧（タップで選択）</h3>
          <div id="routeCards" class="space-y-3.5"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 別画面：ルート検索設定モーダル -->
  <div id="settingsModal" class="hidden fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-3xl w-full max-w-md p-5 sm:p-6 shadow-xl space-y-5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-extrabold text-slate-900">⚙️ 検索・音声設定</h2>
        <button type="button" id="closeSettingsBtn" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100">✕ 閉じる</button>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">飛行機の利用</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="modalFlightOption" value="yes" checked class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-800">✈️ 使う</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="modalFlightOption" value="no" class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-slate-600 peer-checked:bg-slate-200/80 peer-checked:text-slate-900">🚫 使わない</div>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">優先モード</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="modalPreference" value="shortest" checked class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-sky-500 peer-checked:bg-sky-50 peer-checked:text-sky-800">⚡ 一番早い</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="modalPreference" value="cheapest" class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-800">💴 一番安い</div>
          </label>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3">
        <label class="flex items-center justify-between gap-2 cursor-pointer">
          <div>
            <p class="text-xs font-bold text-slate-800">🔁 連続会話モード</p>
            <p class="text-[11px] text-slate-500">ナビロボの読み上げが終わったら自動で聞き取りを再開します</p>
          </div>
          <input type="checkbox" id="modalHandsFree" class="w-4 h-4 rounded border-slate-300 text-indigo-600" />
        </label>
      </div>

      <button type="button" id="saveSettingsBtn" class="w-full py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-sm shadow-md">
        設定を保存して戻る
      </button>
    </div>
  </div>

  <!-- スマホ下部固定バー -->
  <div class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 px-3.5 pt-2.5 mobile-bottom-bar shadow-lg flex gap-2">
    <button type="button" id="mobileVoiceBtn" class="shrink-0 py-3.5 px-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-sm">🎙️ 話す</button>
    <button type="button" id="mobileSubmitBtn" class="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-base">ルートを検索</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
