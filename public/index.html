<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Transit AI - 音声対応スマート経路案内</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="text-slate-800 min-h-screen font-sans antialiased">

  <header class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="stand-mini shrink-0" aria-hidden="true"></div>
        <h1 class="text-base font-extrabold text-slate-900 truncate">Transit AI</h1>
      </div>

      <button type="button" id="openSettingsBtn" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 transition">
        ⚙️ 設定
      </button>
    </div>

    <!-- モード切替タブ（音声画面 / 入力画面） -->
    <div class="max-w-5xl mx-auto px-4 pb-2.5">
      <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-2xl">
        <button type="button" id="tabVoiceBtn" class="py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-white text-indigo-700 shadow-xs transition">
          🎙️ 音声で話す
        </button>
        <button type="button" id="tabInputBtn" class="py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 transition">
          ⌨️ 文字で入力
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-5 py-4 sm:py-7 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
    <!-- 左カラム：音声モード画面 / 入力モード画面 -->
    <section class="lg:col-span-5 lg:sticky lg:top-28">

      <!-- ① 音声モード専用画面 -->
      <div id="voiceScreen" class="bg-gradient-to-b from-sky-50 via-white to-indigo-50/70 border border-sky-200 rounded-3xl p-5 sm:p-6 shadow-sm text-center space-y-4">
        <div class="flex items-center justify-between text-[11px]">
          <span id="settingsSummaryVoice" class="font-bold text-slate-600 bg-white/90 border border-slate-200 px-2.5 py-1 rounded-full">✈️ 使う ／ ⚡ 一番早い</span>
          <span id="charStateBadge" class="font-bold px-2.5 py-1 rounded-full bg-sky-100 text-sky-700">登場中</span>
        </div>

        <!-- キャラクター表示ステージ -->
        <div class="relative w-full h-36 sm:h-40 flex items-center justify-center overflow-hidden">
          <!-- 初回登場：移動スプライトシート（DEMO-move.png） -->
          <div id="walkStage" class="hidden">
            <div id="walkSprite" class="walk-sprite"></div>
          </div>

          <!-- 登場後：待機・表情スプライトシート（DEMO-stand.png） -->
          <div id="avatarWrap" class="flex items-center justify-center cursor-pointer char-idle" title="タップで再登場">
            <div id="standSprite" class="stand-sprite"></div>
          </div>
        </div>

        <div class="bg-white border border-sky-100 rounded-2xl p-3.5 shadow-2xs">
          <p id="charBubble" class="text-sm sm:text-base font-bold text-slate-800 leading-relaxed">
            ぴょんぴょん…やってきたよ！行きたい場所を話しかけてね！
          </p>
        </div>

        <div id="voiceBox" class="hidden bg-sky-50 border border-sky-200 rounded-2xl px-3.5 py-2.5 text-left text-xs">
          <span id="voiceStatus" class="font-bold text-sky-700 block mb-0.5"></span>
          <p id="voiceText" class="font-bold text-slate-900 text-sm"></p>
        </div>

        <button type="button" id="voiceSearchBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-700 hover:to-sky-700 text-white text-base font-extrabold shadow-md transition">
          🎙️ ボタンを押して話しかける
        </button>

        <div class="pt-1 flex items-center justify-center">
          <label class="inline-flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
            <input type="checkbox" id="handsFreeToggle" class="w-4 h-4 rounded border-slate-300 text-indigo-600" />
            <span>🔁 連続会話モード（読み上げ後に自動で聞く）</span>
          </label>
        </div>
      </div>

      <!-- ② 文字入力モード専用画面 -->
      <div id="inputScreen" class="hidden bg-white border border-slate-200 rounded-3xl p-4 sm:p-6 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
          <h2 class="text-sm font-extrabold text-slate-900">⌨️ 出発地・目的地を入力</h2>
          <button type="button" id="openSettingsInlineBtn" class="text-xs font-bold text-sky-700 hover:underline">⚙️ 条件変更</button>
        </div>

        <form id="searchForm" class="space-y-3.5">
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5">
            <div>
              <div class="flex items-center justify-between mb-1">
                <label for="origin" class="text-xs font-bold text-emerald-700">🟢 出発地</label>
                <button type="button" id="gpsBtn" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 transition">📍 現在地を使う</button>
              </div>
              <input type="text" id="origin" value="博多駅" required class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-medium focus:outline-none focus:border-sky-500" />
              <p id="gpsStatus" class="text-xs mt-1 hidden"></p>
            </div>

            <div class="flex items-center justify-between">
              <span class="text-[11px] text-slate-400">出発と到着を入替</span>
              <button type="button" id="swapBtn" class="px-3 py-1 rounded-full bg-white hover:bg-sky-50 text-slate-600 border border-slate-300 text-xs font-bold transition">⇅ 入替</button>
            </div>

            <div>
              <label for="destination" class="block text-xs font-bold text-rose-700 mb-1">🔴 目的地</label>
              <input type="text" id="destination" value="天神駅" required class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-medium focus:outline-none focus:border-sky-500" />
            </div>
          </div>

          <div>
            <label for="userNote" class="block text-xs font-bold text-slate-700 mb-1">追加の要望（任意）</label>
            <input type="text" id="userNote" placeholder="例：荷物が多い、雨に濡れたくない" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base focus:outline-none focus:bg-white focus:border-sky-500" />
          </div>

          <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 text-center">
            現在の設定：<span id="settingsSummaryInput">✈️ 使う ／ ⚡ 一番早い</span>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold text-base shadow-md">
            ルートを検索
          </button>
        </form>
      </div>
    </section>

    <!-- 右カラム：検索結果・案内 -->
    <section id="resultsSection" class="lg:col-span-7 space-y-4">
      <div id="emptyState" class="bg-white border border-dashed border-slate-300 rounded-3xl p-6 text-center space-y-1.5">
        <p class="text-slate-700 font-bold text-xs sm:text-sm">話しかけるか入力して検索すると、ここにルートが表示されるよ！</p>
        <p class="text-slate-500 text-[11px]">例：「今いるところから東京駅まで一番早いルートは？」</p>
      </div>

      <div id="loadingState" class="hidden bg-white border border-slate-200 rounded-3xl p-8 text-center space-y-3">
        <div class="stand-loading mx-auto"></div>
        <p class="text-sm font-bold text-slate-700">ナビロボがぴったりなルートを探しているよ...</p>
      </div>

      <div id="errorState" class="hidden bg-rose-50 border border-rose-200 rounded-2xl p-4 text-rose-700 text-sm font-bold"></div>

      <div id="resultContainer" class="hidden space-y-4">
        <div class="bg-white border border-sky-200 rounded-3xl p-4 sm:p-6 shadow-sm space-y-4">
          <div class="flex items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2.5 min-w-0">
              <div id="replyAvatarWrap" class="flex items-center justify-center shrink-0 char-idle">
                <div id="replyStandSprite" class="stand-sm"></div>
              </div>
              <div class="truncate">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-extrabold text-slate-900">ナビロボ 案内</span>
                  <span id="speakingIndicator" class="hidden items-center gap-1 text-[11px] font-bold text-sky-700 bg-sky-100 px-2 py-0.5 rounded-full">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-600 speaking-dot"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-600 speaking-dot"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-600 speaking-dot"></span>
                    <span>お話し中</span>
                  </span>
                </div>
              </div>
            </div>
            <button type="button" id="speakBtn" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-50 hover:bg-sky-100 text-sky-800 border border-sky-200">🔊 読み上げ</button>
          </div>

          <div class="flex justify-end">
            <div id="userQueryBubble" class="max-w-[88%] bg-slate-100 text-slate-800 text-xs sm:text-sm font-medium px-3.5 py-2 rounded-2xl rounded-tr-sm"></div>
          </div>

          <div class="flex items-start gap-2.5">
            <div class="stand-sm shrink-0 mt-0.5"></div>
            <div class="flex-1 bg-sky-50/70 border border-sky-100 rounded-2xl rounded-tl-sm p-3.5 space-y-2.5">
              <p id="aiReplyLead" class="text-sm sm:text-base font-bold text-slate-900 leading-relaxed"></p>
              <div id="aiReplyHighlights" class="space-y-2"></div>
            </div>
          </div>
        </div>

        <div>
          <h3 class="text-xs font-bold text-slate-600 mb-2 px-1">候補ルート一覧（タップで選択）</h3>
          <div id="routeCards" class="space-y-3"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 別画面：検索・音声設定モーダル -->
  <div id="settingsModal" class="hidden fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-3xl w-full max-w-md p-5 sm:p-6 shadow-xl space-y-5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-extrabold text-slate-900">⚙️ 検索・音声設定</h2>
        <button type="button" id="closeSettingsBtn" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100">✕ 閉じる</button>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">飛行機の利用</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="modalFlightOption" value="yes" checked class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-800">✈️ 使う</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="modalFlightOption" value="no" class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-slate-600 peer-checked:bg-slate-200/80 peer-checked:text-slate-900">🚫 使わない</div>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">優先モード</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="modalPreference" value="shortest" checked class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-sky-500 peer-checked:bg-sky-50 peer-checked:text-sky-800">⚡ 一番早い</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="modalPreference" value="cheapest" class="peer sr-only" />
            <div class="text-center py-3 rounded-xl border-2 border-slate-200 bg-slate-50 text-sm font-bold peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-800">💴 一番安い</div>
          </label>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3">
        <label class="flex items-center justify-between gap-2 cursor-pointer">
          <div>
            <p class="text-xs font-bold text-slate-800">🔁 連続会話モード</p>
            <p class="text-[11px] text-slate-500">ナビロボの読み上げが終わったら自動で聞き取りを再開します</p>
          </div>
          <input type="checkbox" id="modalHandsFree" class="w-4 h-4 rounded border-slate-300 text-indigo-600" />
        </label>
      </div>

      <button type="button" id="saveSettingsBtn" class="w-full py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-sm shadow-md">
        設定を保存して戻る
      </button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
